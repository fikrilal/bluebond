[package]
name = "bluebond"
version = "0.1.1"
edition = "2021"
description = "Sync Windows Bluetooth bond keys to Linux BlueZ for reliable dual-boot pairing."
license = "MIT"
repository = "https://github.com/fikrilal/bluebond"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"
